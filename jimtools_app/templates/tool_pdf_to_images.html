{% extends "base.html" %}
{% block title %}PDF to Images — JimTools{% endblock %}
{% block content %}
<a href="/" class="back-link">← Back to all tools</a>
<h1>PDF to Images</h1>
<p class="subtitle">Convert each page to JPG or PNG. Returns a ZIP of all pages.</p>

<div class="panel">

        <div class="form-row">
          <label>Format</label>
          <select id="format">
            <option value="jpg">JPG (smaller files)</option>
            <option value="png">PNG (lossless)</option>
          </select>
        </div>
        <div class="form-row">
          <label>DPI (image resolution)</label>
          <select id="dpi">
            <option value="100">100 DPI (small)</option>
            <option value="150" selected>150 DPI (recommended)</option>
            <option value="200">200 DPI (high quality)</option>
            <option value="300">300 DPI (print quality)</option>
          </select>
        </div>
        
  <div class="form-row">
    <label>File</label>
    <div class="dropzone" id="dropzone">
      <div class="dz-icon">📤</div>
      <div><strong>Click or drop a file here</strong></div>
      <input type="file" id="fileInput"  accept=".pdf">
    </div>
    <div class="file-list" id="fileList"></div>
  </div>
  <button class="btn" id="submitBtn" disabled>Run</button>
</div>

<div id="processing" style="display: none;" class="panel processing">
  <div class="spinner"></div><div>Processing…</div>
</div>
<div id="results"></div>

<script>
let selectedFiles = [];
const MULTI = false;
const dz = document.getElementById("dropzone");
const fi = document.getElementById("fileInput");
const fl = document.getElementById("fileList");
const sb = document.getElementById("submitBtn");
dz.onclick = () => fi.click();
dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("dragover"); };
dz.ondragleave = () => dz.classList.remove("dragover");
dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("dragover"); add([...e.dataTransfer.files]); };
fi.onchange = () => add([...fi.files]);
function add(files) {
  if (MULTI) selectedFiles = selectedFiles.concat(files);
  else selectedFiles = [files[0]];
  render();
}
function render() {
  fl.innerHTML = selectedFiles.map((f, i) =>
    `<div class="file-item"><span>${f.name}</span><span>${(f.size/1024/1024).toFixed(2)} MB <a href="#" data-i="${i}" class="remove" style="margin-left: 12px; color: var(--text-dim);">✕</a></span></div>`
  ).join("");
  document.querySelectorAll(".remove").forEach(el => el.onclick = (e) => { e.preventDefault(); selectedFiles.splice(parseInt(el.dataset.i), 1); render(); });
  sb.disabled = selectedFiles.length === 0;
}

sb.onclick = async () => {
  const fd = new FormData();
  if (MULTI) selectedFiles.forEach(f => fd.append("files", f));
  else if (selectedFiles[0]) fd.append("file", selectedFiles[0]);
  
          fd.append("format", document.getElementById("format").value);
          fd.append("dpi", document.getElementById("dpi").value);
        
  document.getElementById("processing").style.display = "block";
  document.getElementById("results").innerHTML = "";
  sb.disabled = true;
  try {
    const r = await fetch("/tool/pdf-to-images", { method: "POST", body: fd });
    const d = await r.json();
    let html;
    if (d.error) html = `<div class="result-card error"><h3>Error</h3><div>${d.error}</div></div>`;
    else { html = `<div class="result-card"><h3>Converted ${d.page_count} pages to images</h3><a class="download-link" href="${d.download_url}">Download ZIP</a></div>`; }
    document.getElementById("results").innerHTML = html;
  } catch (e) {
    document.getElementById("results").innerHTML = `<div class="result-card error">${e.message}</div>`;
  } finally {
    document.getElementById("processing").style.display = "none";
    sb.disabled = false;
  }
};
</script>
{% endblock %}
